<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レスババトル ONLINE</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #3700b3;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button:hover {
      background: #6200ee;
    }

    .screen {
      display: none;
    }

    .active {
      display: block;
    }

    #chat-box {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #444;
      padding: 10px;
      background: #121212;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    .message {
      margin-bottom: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      background: #2a2a2a;
    }

    .my-message {
      background: #1b5e20;
      text-align: right;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 10px;
      background: #2a2a2a;
      border-radius: 4px;
    }

    pre {
      white-space: pre-wrap;
      background: #121212;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- メイン画面 -->
  <div id="main-screen" class="screen active">
    <h1>レスババトル ONLINE</h1>
    <label>プレイヤー名:</label>
    <input type="text" id="username-input" placeholder="名前を入力">
    <button onclick="startMatching()">オンライン対戦を探す</button>
    <button onclick="showRanking()">ランキングを見る</button>
  </div>

  <!-- 待機画面 -->
  <div id="vs-match-screen" class="screen">
    <h2>対戦相手を探しています...</h2>
    <p style="text-align:center;">しばらくお待ちください。</p>
    <button onclick="cancelMatching()">キャンセル</button>
  </div>

  <!-- 対戦画面 -->
  <div id="battle-screen" class="screen">
    <h2 id="battle-theme">お題: </h2>
    <div class="status-bar">
      <div>自分 HP: <span id="my-hp">2000</span></div>
      <div>立場: <span id="my-side">-</span></div>
    </div>
    <div id="chat-box"></div>
    <textarea id="message-input" rows="3" placeholder="発言を入力..."></textarea>
    <button onclick="sendMessage()">送信</button>
  </div>

  <!-- ランキング画面 -->
  <div id="ranking-screen" class="screen">
    <h2>ランキング</h2>
    <pre id="ranking-content">読み込み中...</pre>
    <button onclick="showScreen('main-screen')">戻る</button>
  </div>

</div>

<script>
  // 自身のサーバーアドレスに変更してください
  const SERVER_URL = 'http://localhost:3000';

  let myUsername = '';
  let myUserId = '';
  let myRoomName = '';
  let myChosenSide = '';
  let myHp = 2000;
  let pollingInterval = null;

  // 初期化処理
  window.onload = () => {
    myUserId = localStorage.getItem('yururon_user_id');
    if (!myUserId) {
      myUserId = `user_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
      localStorage.setItem('yururon_user_id', myUserId);
    }
  };

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function startMatching() {
    const input = document.getElementById('username-input').value.trim();
    myUsername = input || '名無し';
    showScreen('vs-match-screen');
    pollMatch();
  }

  function cancelMatching() {
    showScreen('main-screen');
    // ページリロードによりサーバー側の接続判定を切断させる
    location.reload();
  }

  function pollMatch() {
    fetch(`${SERVER_URL}/match?username=${encodeURIComponent(myUsername)}&userId=${encodeURIComponent(myUserId)}`)
      .then(res => res.text())
      .then(data => {
        if (data.startsWith('MATCHING_SUCCESS')) {
          // パース処理: MATCHING_SUCCESS | Room: room_xxx | お題 | YOUR_SIDE: xxx
          const parts = data.split(' | ');
          myRoomName = parts[1].replace('Room: ', '').trim();
          const theme = parts[2].trim();
          myChosenSide = parts[3] ? parts[3].replace('YOUR_SIDE: ', '').trim() : '対戦相手';

          startBattle(theme);
        } else if (data === 'WAITING_TIMEOUT') {
          // タイムアウトした場合は再度接続を試みる
          if (document.getElementById('vs-match-screen').classList.contains('active')) {
            pollMatch();
          }
        }
      })
      .catch(err => {
        console.error('通信エラー:', err);
        setTimeout(pollMatch, 3000);
      });
  }

  function startBattle(theme) {
    showScreen('battle-screen');
    document.getElementById('battle-theme').innerText = `お題: ${theme}`;
    document.getElementById('my-side').innerText = myChosenSide;
    document.getElementById('my-hp').innerText = myHp;

    // 定期的にメッセージを取得
    pollingInterval = setInterval(fetchMessages, 1500);
  }

  function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text) return;

    fetch(`${SERVER_URL}/send-message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        roomName: myRoomName,
        sender: myUsername,
        text: text,
        hp: myHp
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'ok') {
        input.value = '';
        fetchMessages();
      }
    });
  }

  function fetchMessages() {
    fetch(`${SERVER_URL}/get-messages?roomName=${encodeURIComponent(myRoomName)}`)
      .then(res => {
        if (!res.ok) throw new Error('Room not found');
        return res.json();
      })
      .then(data => {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = '';
        data.messages.forEach(msg => {
          const div = document.createElement('div');
          div.className = `message ${msg.sender === myUsername ? 'my-message' : ''}`;
          div.innerText = `${msg.sender}: ${msg.text}`;
          chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      })
      .catch(() => {
        // 部屋が存在しない場合（相手が終了したなど）
        clearInterval(pollingInterval);
      });
  }

  function showRanking() {
    showScreen('ranking-screen');
    fetch(`${SERVER_URL}/ranking`)
      .then(res => res.text())
      .then(data => {
        document.getElementById('ranking-content').innerText = data;
      });
  }
</script>

</body>
</html>
