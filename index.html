<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yururon Battle</title>
  <style>
    body {
      background-color: #00A2FF;
      color: #333333;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* メニュー画面 */
    #menu-screen {
      position: relative;
      width: 90%;
      max-width: 1000px;
      height: 550px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      padding: 20px;
    }

    #user-profile-area {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 50px;
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
    }

    #user-icon-slot {
      width: 60px;
      height: 60px;
      background-color: #FFFFFF;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.1s;
      border: 2px solid #FFFFFF;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    #user-icon-slot:hover { transform: scale(1.05); }
    #custom-icon-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    #fallback-text { font-size: 11px; font-weight: bold; color: #00A2FF; text-align: center; line-height: 1.2; }
    #icon-file-input { display: none; }

    #user-info-text { display: flex; flex-direction: column; }
    #game-title { font-size: 22px; font-weight: bold; margin: 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
    #user-badge { font-size: 13px; font-weight: bold; opacity: 0.9; }
    #icon-item-label { font-size: 11px; background: #FFFFFF; color: #00A2FF; padding: 2px 8px; border-radius: 10px; font-weight: bold; margin-top: 4px; width: fit-content; cursor: pointer; }

    .right-menu-container { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }

    .side-btn {
      width: 70px; height: 70px; border-radius: 50%; border: 3px solid #FFFFFF; font-weight: bold; font-size: 13px; cursor: pointer; transition: all 0.1s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.15); outline: none; display: flex; align-items: center; justify-content: center;
    }
    .side-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 8px rgba(0,0,0,0.2); }
    .btn-settings { background-color: #FF7675; color: white; }
    .btn-ranking { background-color: #FFF385; color: #333333; border-color: #333333; }
    .btn-rule { background-color: #A29BFE; color: white; }

    #vs-logo-container { flex: 1; display: flex; align-items: center; justify-content: center; margin-top: 40px; }
    .vs-bubble { position: relative; width: 180px; height: 180px; background: #FFFFFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 70px; font-weight: 900; color: #00A2FF; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

    #display-box { background: rgba(255, 255, 255, 0.9); border: 2px solid #FFFFFF; border-radius: 15px; padding: 15px 30px; font-size: 18px; font-weight: bold; text-align: center; white-space: pre-wrap; box-shadow: 0 6px 15px rgba(0,0,0,0.1); width: 60%; margin-bottom: 20px; }

    .bottom-btn-container { width: 80%; max-width: 600px; margin-bottom: 10px; }
    .btn-play { width: 100%; background-color: #FFFFFF; color: #00A2FF; border: 4px solid #FFFFFF; padding: 18px 0; font-size: 26px; font-weight: bold; cursor: pointer; border-radius: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.15); transition: all 0.2s ease; }
    .btn-play:hover { background-color: #F0F8FF; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

    /* VSマッチング画面 */
    #vs-match-screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; background-color: #00A2FF; }
    .vs-match-box { background-color: #A0A0A0; border: 6px solid #FFFFFF; border-radius: 20px; width: 90%; max-width: 800px; padding: 40px 20px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 15px 30px rgba(0,0,0,0.3); position: relative; box-sizing: border-box; }
    #match-countdown-banner { position: absolute; top: -60px; background-color: #FF7675; color: white; padding: 10px 30px; border-radius: 30px; font-size: 22px; font-weight: bold; border: 3px solid #FFFFFF; box-shadow: 0 5px 15px rgba(0,0,0,0.2); white-space: nowrap; }
    .match-player-slot { display: flex; flex-direction: column; align-items: center; width: 40%; }
    .match-icon-container { width: 160px; height: 160px; background-color: #8B5A2B; border: 4px solid #FFFFFF; border-radius: 50%; box-shadow: 0 8px 16px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 20px; }
    .match-icon-container img { width: 100%; height: 100%; object-fit: cover; }
    .match-icon-fallback { color: #FFFFFF; font-size: 18px; font-weight: bold; text-align: center; }
    .match-info-bar { width: 100%; background-color: #3A3A3A; color: #FFFFFF; text-align: center; padding: 12px 5px; font-size: 16px; font-weight: bold; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .match-center-vs { font-size: 60px; font-weight: 900; color: #FFF385; text-shadow: 4px 4px 0px #333; font-style: italic; }

    /* バトル画面 */
    #debate-screen { display: none; flex-direction: column; align-items: center; width: 95%; max-width: 700px; height: 85vh; border: 4px solid #FFFFFF; border-radius: 25px; background-color: #54A0FF; padding: 20px; box-shadow: 0 12px 24px rgba(0,0,0,0.15); box-sizing: border-box; position: relative; }
    #theme-info { width: 100%; background-color: #FF7675; border: 3px solid #FFFFFF; border-radius: 15px; padding: 12px; text-align: center; color: white; font-weight: bold; margin-bottom: 10px; box-sizing: border-box; font-size: 18px; }
    #timer-panel { width: 100%; display: flex; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
    .time-sub-box { flex: 1; text-align: center; font-size: 14px; font-weight: bold; padding: 8px; border-radius: 10px; border: 2px solid #FFFFFF; }
    #game-timer-box { background-color: #FFEAA7; color: #333333; }
    #response-timer-box { background-color: #1DD1A1; color: white; }

    #hp-container { width: 100%; background-color: rgba(0,0,0,0.2); border: 2px solid #FFFFFF; border-radius: 15px; padding: 12px; margin-bottom: 15px; box-sizing: border-box; color: white; font-size: 14px; font-weight: bold; }
    .hp-bar-bg { width: 100%; background-color: #FFF; height: 18px; border-radius: 9px; overflow: hidden; margin-top: 5px; }
    .hp-bar-fill { height: 100%; background-color: #1DD1A1; width: 100%; transition: width 0.3s ease; }

    #chat-box { width: 100%; flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; background: rgba(255,255,255,0.9); border-radius: 20px; }
    .message-row { display: flex; flex-direction: column; width: 100%; margin: 6px 0; }
    .my-message { align-items: flex-end; }
    .other-message { align-items: flex-start; }
    .sender-name { font-size: 12px; color: #333333; font-weight: bold; margin-bottom: 2px; }

    .bubble { max-width: 75%; padding: 12px 18px; border-radius: 18px; font-size: 16px; font-weight: bold; line-height: 1.4; word-wrap: break-word; }
    .my-message .bubble { background-color: #1DD1A1; color: white; border-radius: 18px 18px 0px 18px; }
    .other-message .bubble { background-color: #DFE4EA; color: #333333; border-radius: 18px 18px 18px 0px; }
    
    .chat-input-container { display: flex; width: 100%; gap: 10px; }
    #message-input { flex-grow: 1; padding: 15px; font-size: 16px; border: 3px solid #FFFFFF; border-radius: 15px; outline: none; }
    #send-btn { padding: 15px 30px; font-size: 16px; background-color: #FFD166; color: #333333; border: 3px solid #FFFFFF; border-radius: 15px; cursor: pointer; font-weight: bold; }
    .btn-back { position: absolute; top: 10px; right: 10px; padding: 8px 18px; font-size: 14px; background-color: #FF7675; border-radius: 20px; border: 2px solid #FFFFFF; color: white; font-weight: bold; cursor: pointer;}
  </style>
</head>
<body>

  <!-- 1. メインメニュー画面 -->
  <div id="menu-screen">
    <div id="user-profile-area">
      <div id="user-icon-slot" onclick="document.getElementById('icon-file-input').click()">
        <img id="custom-icon-img" src="" alt="Icon">
        <span id="fallback-text">アイコン<br>変更</span>
      </div>
      <input type="file" id="icon-file-input" accept="image/*" onchange="loadIcon(event)">
      
      <div id="user-info-text">
        <h1 id="game-title">ゆる論バトル</h1>
        <div id="user-badge"><span id="player-name">プレイヤー</span> (Lv.1)</div>
        <div id="icon-item-label" onclick="changeName()">名前を変更</div>
      </div>
    </div>

    <div class="right-menu-container">
      <button class="side-btn btn-settings" onclick="alert('設定機能は開発中です')">設定</button>
      <button class="side-btn btn-ranking" onclick="showRanking()">順位</button>
      <button class="side-btn btn-rule" onclick="alert('【ルール】\nランダムに選ばれたお題について相手とバトル！相手のHPを0にしたら勝ちです！')">ルール</button>
    </div>

    <div id="vs-logo-container">
      <div class="vs-bubble">VS</div>
    </div>

    <div id="display-box">対戦ボタンを押して<br>マッチングを開始してください！</div>

    <div class="bottom-btn-container">
      <button class="btn-play" onclick="startMatching()">対戦開始</button>
    </div>
  </div>

  <!-- 2. マッチング演出画面 -->
  <div id="vs-match-screen">
    <div class="vs-match-box">
      <div id="match-countdown-banner">MATCHING...</div>
      
      <div class="match-player-slot">
        <div class="match-icon-container">
          <span class="match-icon-fallback" id="p1-icon-text">YOU</span>
        </div>
        <div class="match-info-bar" id="p1-name-bar">あなた</div>
      </div>

      <div class="match-center-vs">VS</div>

      <div class="match-player-slot">
        <div class="match-icon-container">
          <span class="match-icon-fallback" id="p2-icon-text">WAITING</span>
        </div>
        <div class="match-info-bar" id="p2-name-bar">探しています...</div>
      </div>
    </div>
  </div>

  <!-- 3. バトル画面 -->
  <div id="debate-screen">
    <button class="btn-back" onclick="exitGame()">退出</button>
    <div id="theme-info">お題: 読み込み中...</div>
    
    <div id="timer-panel">
      <div class="time-sub-box" id="game-timer-box">残り時間: 60s</div>
      <div class="time-sub-box" id="response-timer-box">あなたのターン</div>
    </div>

    <div id="hp-container">
      相手のHP
      <div class="hp-bar-bg">
        <div class="hp-bar-fill" id="hp-bar" style="width: 100%;"></div>
      </div>
    </div>

    <div id="chat-box"></div>

    <div class="chat-input-container">
      <input type="text" id="message-input" placeholder="意見を入力してください..." onkeypress="handleKeyPress(event)">
      <button id="send-btn" onclick="sendMessage()">送信</button>
    </div>
  </div>

  <script>
    let username = localStorage.getItem('yururon_username') || '名無し' + Math.floor(Math.random() * 1000);
    let userId = localStorage.getItem('yururon_userid') || 'user_' + Date.now();
    localStorage.setItem('yururon_username', username);
    localStorage.setItem('yururon_userid', userId);

    document.getElementById('player-name').innerText = username;

    let roomName = "";
    let mySide = "";
    let myHp = 2000;
    let enemyHp = 2000;
    let pollInterval = null;

    function changeName() {
      const newName = prompt("新しい名前を入力してください:", username);
      if (newName && newName.trim() !== "") {
        username = newName.trim();
        localStorage.setItem('yururon_username', username);
        document.getElementById('player-name').innerText = username;
      }
    }

    function loadIcon(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('custom-icon-img');
          img.src = e.target.result;
          img.style.display = 'block';
          document.getElementById('fallback-text').style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    }

    async function startMatching() {
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('vs-match-screen').style.display = 'flex';
      document.getElementById('p1-name-bar').innerText = username;

      try {
        const res = await fetch(`/match?username=${encodeURIComponent(username)}&userId=${userId}`);
        const text = await res.text();

        if (text.startsWith('MATCHING_SUCCESS')) {
          const parts = text.split(' | ');
          roomName = parts[1].replace('Room: ', '');
          const theme = parts[2];
          mySide = parts[3].replace('YOUR_SIDE: ', '');

          document.getElementById('p2-name-bar').innerText = "対戦相手";
          document.getElementById('match-countdown-banner').innerText = "MATCH FOUND!";

          setTimeout(() => {
            document.getElementById('vs-match-screen').style.display = 'none';
            document.getElementById('debate-screen').style.display = 'flex';
            document.getElementById('theme-info').innerText = `お題: ${theme} (あなたは【${mySide}】派)`;
            startPolling();
          }, 1500);
        } else {
          alert('マッチングに失敗しました。再試行してください。');
          location.reload();
        }
      } catch (e) {
        alert('通信エラーが発生しました');
        location.reload();
      }
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !roomName) return;

      input.value = '';
      
      // ダメージ計算（送信ごとに相手に攻撃）
      enemyHp = Math.max(0, enemyHp - 400);

      await fetch('/send-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roomName, sender: username, text, hp: enemyHp })
      });
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function startPolling() {
      pollInterval = setInterval(async () => {
        if (!roomName) return;
        try {
          const res = await fetch(`/get-messages?roomName=${roomName}`);
          if (!res.ok) return;
          const data = await res.json();

          const chatBox = document.getElementById('chat-box');
          chatBox.innerHTML = '';

          data.messages.forEach(msg => {
            const row = document.createElement('div');
            const isMe = msg.sender === username;
            row.className = `message-row ${isMe ? 'my-message' : 'other-message'}`;
            row.innerHTML = `
              <div class="sender-name">${msg.sender}</div>
              <div class="bubble">${msg.text}</div>
            `;
            chatBox.appendChild(row);
          });
          chatBox.scrollTop = chatBox.scrollHeight;

          // HPゲージ更新
          if (data.hpData) {
            Object.keys(data.hpData).forEach(p => {
              if (p !== username) {
                const currentHp = data.hpData[p];
                const pct = Math.max(0, (currentHp / 2000) * 100);
                document.getElementById('hp-bar').style.width = pct + '%';

                if (currentHp <= 0) {
                  clearInterval(pollInterval);
                  alert('VICTORY! あなたの勝ちです！');
                  exitGame();
                }
              }
            });
          }
        } catch (e) {}
      }, 1000);
    }

    async function showRanking() {
      const res = await fetch('/ranking');
      const text = await res.text();
      alert(text);
    }

    function exitGame() {
      if (pollInterval) clearInterval(pollInterval);
      if (roomName) {
        fetch('/game-over', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roomName })
        });
      }
      location.reload();
    }
  </script>
</body>
</html>
