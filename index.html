<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆるろん ONLINE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-mark {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
      font-weight: bold;
      font-size: 24px;
      color: #fff;
      margin-bottom: 10px;
    }

    h1, h2 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 198, 255, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #00c6ff;
      box-shadow: 0 0 8px rgba(0, 198, 255, 0.4);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    button:hover {
      box-shadow: 0 0 15px rgba(0, 198, 255, 0.6);
      transform: translateY(-1px);
    }

    .screen {
      display: none;
    }

    .active {
      display: block;
    }

    #chat-box {
      height: 280px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .message {
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 14px;
    }

    .my-message {
      background: rgba(0, 198, 255, 0.2);
      border: 1px solid rgba(0, 198, 255, 0.4);
      text-align: right;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 13px;
    }

    pre {
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- メイン画面 -->
  <div id="main-screen" class="screen active">
    <div class="logo-container">
      <div class="logo-mark">VS</div>
      <h1>ゆるろん ONLINE</h1>
    </div>
    <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 6px;">プレイヤー名</label>
    <input type="text" id="username-input" placeholder="名前を入力">
    <button onclick="startMatching()">対戦相手を探す</button>
    <button onclick="showRanking()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">ランキングを見る</button>
  </div>

  <!-- 待機画面 -->
  <div id="vs-match-screen" class="screen">
    <div class="logo-container">
      <div class="logo-mark">...</div>
      <h2>対戦相手を探しています</h2>
    </div>
    <p style="text-align:center; color: #aaa; font-size: 14px; margin-bottom: 20px;">ゆるーくお待ちください</p>
    <button onclick="cancelMatching()" style="background: rgba(255,255,255,0.1);">キャンセル</button>
  </div>

  <!-- 対戦画面 -->
  <div id="battle-screen" class="screen">
    <h2 id="battle-theme" style="color: #00c6ff;">お題: </h2>
    <div class="status-bar">
      <div>自分 HP: <span id="my-hp">2000</span></div>
      <div>立場: <span id="my-side">-</span></div>
    </div>
    <div id="chat-box"></div>
    <textarea id="message-input" rows="3" placeholder="意見を入力..."></textarea>
    <button onclick="sendMessage()">送信</button>
  </div>

  <!-- ランキング画面 -->
  <div id="ranking-screen" class="screen">
    <h2>ランキング</h2>
    <pre id="ranking-content">読み込み中...</pre>
    <button onclick="showScreen('main-screen')" style="margin-top: 12px;">戻る</button>
  </div>

</div>

<script>
  const SERVER_URL = 'http://localhost:3000';

  let myUsername = '';
  let myUserId = '';
  let myRoomName = '';
  let myChosenSide = '';
  let myHp = 2000;
  let pollingInterval = null;

  window.onload = () => {
    myUserId = localStorage.getItem('yururon_user_id');
    if (!myUserId) {
      myUserId = `user_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
      localStorage.setItem('yururon_user_id', myUserId);
    }
  };

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function startMatching() {
    const input = document.getElementById('username-input').value.trim();
    myUsername = input || '名無し';
    showScreen('vs-match-screen');
    pollMatch();
  }

  function cancelMatching() {
    showScreen('main-screen');
    location.reload();
  }

  function pollMatch() {
    fetch(`${SERVER_URL}/match?username=${encodeURIComponent(myUsername)}&userId=${encodeURIComponent(myUserId)}`)
      .then(res => res.text())
      .then(data => {
        if (data.startsWith('MATCHING_SUCCESS')) {
          const parts = data.split(' | ');
          myRoomName = parts[1].replace('Room: ', '').trim();
          const theme = parts[2].trim();
          myChosenSide = parts[3] ? parts[3].replace('YOUR_SIDE: ', '').trim() : '対戦相手';

          startBattle(theme);
        } else if (data === 'WAITING_TIMEOUT') {
          if (document.getElementById('vs-match-screen').classList.contains('active')) {
            pollMatch();
          }
        }
      })
      .catch(err => {
        console.error('通信エラー:', err);
        setTimeout(pollMatch, 3000);
      });
  }

  function startBattle(theme) {
    showScreen('battle-screen');
    document.getElementById('battle-theme').innerText = `お題: ${theme}`;
    document.getElementById('my-side').innerText = myChosenSide;
    document.getElementById('my-hp').innerText = myHp;

    pollingInterval = setInterval(fetchMessages, 1500);
  }

  function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text) return;

    fetch(`${SERVER_URL}/send-message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        roomName: myRoomName,
        sender: myUsername,
        text: text,
        hp: myHp
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'ok') {
        input.value = '';
        fetchMessages();
      }
    });
  }

  function fetchMessages() {
    fetch(`${SERVER_URL}/get-messages?roomName=${encodeURIComponent(myRoomName)}`)
      .then(res => {
        if (!res.ok) throw new Error('Room not found');
        return res.json();
      })
      .then(data => {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = '';
        data.messages.forEach(msg => {
          const div = document.createElement('div');
          div.className = `message ${msg.sender === myUsername ? 'my-message' : ''}`;
          div.innerText = `${msg.sender}: ${msg.text}`;
          chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      })
      .catch(() => {
        clearInterval(pollingInterval);
      });
  }

  function showRanking() {
    showScreen('ranking-screen');
    fetch(`${SERVER_URL}/ranking`)
      .then(res => res.text())
      .then(data => {
        document.getElementById('ranking-content').innerText = data;
      });
  }
</script>

</body>
</html>
