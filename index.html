<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆるろん ONLINE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-mark {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
      font-weight: bold;
      font-size: 24px;
      color: #fff;
      margin-bottom: 10px;
    }

    h1, h2 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 198, 255, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #00c6ff;
      box-shadow: 0 0 8px rgba(0, 198, 255, 0.4);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    button:hover {
      box-shadow: 0 0 15px rgba(0, 198, 255, 0.6);
      transform: translateY(-1px);
    }

    .screen {
      display: none;
    }

    .active {
      display: block;
    }

    #chat-box {
      height: 280px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .message {
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 14px;
    }

    .my-message {
      background: rgba(0, 198, 255, 0.2);
      border: 1px solid rgba(0, 198, 255, 0.4);
      text-align: right;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 13px;
    }

    pre {
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- メイン画面 -->
  <div id="main-screen" class="screen active">
    <div class="logo-container">
      <div class="logo-mark">VS</div>
      <h1>ゆるろん ONLINE</h1>
    </div>
    <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 6px;">プレイヤー名</label>
    <input type="text" id="username-input" placeholder="名前を入力">
    <button onclick="startMatching()">対戦相手を探す</button>
    <button onclick="showRanking()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">ランキングを見る</button>
  </div>

  <!-- 待機画面 -->
  <div id="vs-match-screen" class="screen">
    <div class="logo-container">
      <div class="logo-mark">...</div>
      <h2>対戦相手を探しています</h2>
    </div>
    <p style="text-align:center; color: #aaa; font-size: 14px; margin-bottom: 20px;">ゆるーくお待ちください</p>
    <button onclick="cancelMatching()" style="background: rgba(255,255,255,0.1);">キャンセル</button>
  </div>

  <!-- 対戦画面 -->
  <div id="battle-screen" class="screen">
    <h2 id="battle-theme" style="color: #00c6ff;">お題: </h2>
    <div class="status-bar">
      <div>自分 HP: <span id="my-hp">2000</span></div>
      <div>立場: <span id="my-side">-</span></div>
    </div>
    <div id="chat-box"></div>
    <textarea id="message-input" rows="3" placeholder="意見を入力..."></textarea>
    <button onclick="sendMessage()">送信</button>
  </div>

  <!-- ランキング画面 -->
  <div id="ranking-screen" class="screen">
    <h2>ランキング</h2>
    <pre id="ranking-content">読み込み中...</pre>
    <button onclick="showScreen('main-screen')" style="margin-top: 12px;">戻る</button>
  </div>

</div>

<script>
// ★新しいRailwayのURLを設定
const SERVER_URL = "https://game-server-production-b1e3.up.railway.app";

let currentRoom = null;
let mySide = null;
let pollInterval = null;

// 1. マッチング処理
async function startMatching(username, userId) {
  try {
    const response = await fetch(`${SERVER_URL}/match?username=${encodeURIComponent(username)}&userId=${encodeURIComponent(userId)}`);
    const text = await response.text();

    if (text === 'WAITING_TIMEOUT') {
      console.log("マッチングがタイムアウトしました。再試行します...");
      return startMatching(username, userId); // 自動再試行
    }

    if (text.startsWith('MATCHING_SUCCESS')) {
      // レスポンス解析: MATCHING_SUCCESS | Room: room_xxx | お題 | YOUR_SIDE: sideA
      const parts = text.split(' | ');
      currentRoom = parts[1].replace('Room: ', '').trim();
      const theme = parts[2];
      mySide = parts[3] ? parts[3].replace('YOUR_SIDE: ', '').trim() : '';

      console.log(`マッチング成功！ 部屋名: ${currentRoom}, お題: ${theme}, 自分の立場: ${mySide}`);
      
      // ポーリング（定期的にメッセージを取得）を開始
      startPolling();
      return { room: currentRoom, theme, side: mySide };
    }
  } catch (error) {
    console.error("マッチングエラー:", error);
  }
}

// 2. メッセージ送信処理
async function sendMessage(sender, text, currentHp) {
  if (!currentRoom) return;

  try {
    const response = await fetch(`${SERVER_URL}/send-message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        roomName: currentRoom,
        sender: sender,
        text: text,
        hp: currentHp
      })
    });
    const data = await response.json();
    return data;
  } catch (error) {
    console.error("送信エラー:", error);
  }
}

// 3. メッセージ＆HP取得（定期受信）
function startPolling() {
  if (pollInterval) clearInterval(pollInterval);

  pollInterval = setInterval(async () => {
    if (!currentRoom) return;

    try {
      const response = await fetch(`${SERVER_URL}/get-messages?roomName=${encodeURIComponent(currentRoom)}`);
      if (response.ok) {
        const data = await response.json();
        // 取得したメッセージデータ(data.messages)やHP(data.hpData)で画面を更新する処理をここに書く
      }
    } catch (error) {
      console.error("受信エラー:", error);
    }
  }, 1500); // 1.5秒ごとに同期
}

// 4. スコア保存（ゲーム終了時など）
async function updateScore(userId, name, level, exp, label) {
  try {
    await fetch(`${SERVER_URL}/update-score`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, name, level, exp, label })
    });
  } catch (error) {
    console.error("スコア保存エラー:", error);
  }
}

// 5. ランキング取得
async function getRanking() {
  try {
    const response = await fetch(`${SERVER_URL}/ranking`);
    const text = await response.text();
    return text;
  } catch (error) {
    console.error("ランキング取得エラー:", error);
  }
}  
</script>

</body>
</html>
